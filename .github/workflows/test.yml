name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q dafeiyu
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: node --test tests/openclaw.test.mjs
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker pull python@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db
      - run: python -m unittest discover -s tests -p test_docker.py -v
        env:
          DAFEIYU_TEST_DOCKER: '1'
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/privacy_audit.py
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: integrations/runtime/package-lock.json
      - run: python3 scripts/repack_npm.py --check
      - run: npm ci --ignore-scripts --prefix integrations/runtime --no-fund
      - run: node tests/runtime/compat.mjs integrations/runtime
      - run: integrations/runtime/node_modules/.bin/openclaw --version
      - run: npm audit --prefix integrations/runtime --audit-level=low
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/setup_age.py
      - run: python -m unittest discover -s tests -p test_backup.py -v
        env:
          DAFEIYU_TEST_AGE: '1'

  speech:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: integrations/speech/requirements.txt
      - run: |
          python -m pip install --only-binary=:all: --require-hashes -r integrations/speech/requirements.txt
      - run: python -c "import faster_whisper, numpy, onnxruntime; print('Offline speech runtime imports passed')"
      - run: python -m unittest discover -s tests -p test_speech.py -v

  browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - run: python scripts/setup_browser.py
      - run: python -m unittest discover -s tests -p test_browser.py -v
        env:
          DAFEIYU_TEST_BROWSER: '1'
